[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-cli"
version = "2.3.0"
description = "用命令行驱动 arena.ai/agent：登录、导入 cookies、提问、取回 Agent 的结果"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["playwright>=1.45"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools]
packages = ["arena", "arena.commands"]
