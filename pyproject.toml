[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-cli"
version = "2.4.0"
description = "Drive arena.ai/agent from the command line: log in, import cookies, ask questions, and retrieve the Agent's results"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["playwright>=1.45"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools]
packages = ["arena", "arena.commands"]
